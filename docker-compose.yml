# Development lokal saja, bukan untuk deployment. Lihat bagian "Local development" di CLAUDE.md.
# GO_VERSION dan NODE_VERSION wajib diisi (lewat .env), ikuti backend/go.mod dan web/package.json.

x-backend: &backend
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
    args:
      GO_VERSION: ${GO_VERSION:?isi GO_VERSION di .env, lihat .env.example}
  working_dir: /app
  environment: &backend-env
    DATABASE_URL: postgres://sigesit:sigesit@postgres:5432/sigesit?sslmode=disable
    REDIS_ADDR: redis:6379
    KAFKA_BROKERS: kafka:29092
  volumes:
    - ./backend:/app
    - go-cache:/root/.cache/go-build
    - go-mod:/go/pkg/mod
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_started

services:
  backend:
    <<: *backend
    command: go run ./cmd/api
    environment:
      <<: *backend-env
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"

  worker:
    <<: *backend
    command: go run ./cmd/worker

  consumer:
    <<: *backend
    command: go run ./cmd/consumer
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:?isi NODE_VERSION di .env, lihat .env.example}
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sigesit
      POSTGRES_PASSWORD: sigesit
      POSTGRES_DB: sigesit
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigesit"]
      interval: 5s
      retries: 10

  # Menjalankan migrasi backend/migrations sekali setiap `docker compose up`, lalu berhenti.
  migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path=/migrations", "-database=postgres://sigesit:sigesit@postgres:5432/sigesit?sslmode=disable", "up"]
    volumes:
      - ./backend/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Mengisi data contoh backend/seeds/seed.sql (idempoten, satu transaksi) setelah migrasi, lalu berhenti.
  seed:
    image: postgres:16-alpine
    command: ["psql", "postgres://sigesit:sigesit@postgres:5432/sigesit", "-v", "ON_ERROR_STOP=1", "-f", "/seeds/seed.sql"]
    volumes:
      - ./backend/seeds:/seeds:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Kafka mode KRaft (tanpa ZooKeeper). Container lain memakai kafka:29092, aplikasi di host memakai localhost:9092.
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

volumes:
  go-cache:
  go-mod:
  web-node-modules:
  postgres-data:
