openapi: 3.0.3
info:
  title: SiGesit Performance API
  version: 1.0.0
  description: API KPI performa SiGesit (kurir SiCepat) untuk dashboard monitoring.
paths:
  /healthz:
    get:
      summary: Cek status service
      responses:
        "200":
          description: Service sehat
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /api/v1/courier-metrics:
    get:
      summary: Daftar KPI harian per kurir
      parameters:
        - { name: start_date, in: query, required: true, schema: { type: string, format: date }, description: "Awal periode (tanggal WIB), maksimal 31 hari dari end_date" }
        - { name: end_date, in: query, required: true, schema: { type: string, format: date } }
        - { name: branch_id, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Satu halaman KPI kurir
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CourierMetric" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "400":
          description: Parameter atau filter tidak valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Kesalahan server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/courier-performance:
    get:
      summary: Ranking performa kurir beserta tren harian
      description: "Urutan: success_rate menurun, lalu courier_id menaik. rank adalah posisi global, stabil di semua halaman. Kurir tanpa event di periode tidak muncul."
      parameters:
        - { name: start_date, in: query, required: true, schema: { type: string, format: date }, description: "Awal periode (tanggal WIB, inklusif), maksimal 31 hari dari end_date" }
        - { name: end_date, in: query, required: true, schema: { type: string, format: date }, description: "Akhir periode (tanggal WIB, inklusif)" }
        - { name: branch_id, in: query, required: false, schema: { type: string }, description: "Kosong berarti semua cabang" }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Satu halaman ranking performa kurir
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CourierPerformance" }
                  meta: { $ref: "#/components/schemas/CourierPerformanceMeta" }
        "400":
          description: Parameter atau filter tidak valid (invalid_query atau invalid_filter)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Kesalahan server (internal_error)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/failed-deliveries/summary:
    get:
      summary: Ringkasan paket gagal kirim beserta alasan dan kurir teratas
      description: "Respons satu objek berbentuk {data} tanpa meta (pengecualian disengaja dari {data, meta}). Periode pembanding: rentang dengan panjang hari sama tepat sebelum start_date, dengan filter cabang yang sama."
      parameters:
        - { name: start_date, in: query, required: true, schema: { type: string, format: date }, description: "Awal periode (tanggal WIB, inklusif), maksimal 31 hari dari end_date" }
        - { name: end_date, in: query, required: true, schema: { type: string, format: date }, description: "Akhir periode (tanggal WIB, inklusif)" }
        - { name: branch_id, in: query, required: false, schema: { type: string }, description: "Kosong berarti semua cabang" }
      responses:
        "200":
          description: Ringkasan gagal kirim
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/FailedSummary" }
        "400":
          description: Parameter atau filter tidak valid (invalid_query atau invalid_filter)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Kesalahan server (internal_error)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/branch-performance:
    get:
      summary: Ranking cabang beserta tren harian dan target
      description: "Urutan: success_rate menurun, lalu branch_id menaik. rank global, stabil di semua halaman. Cabang tanpa data di periode tidak muncul. target null bila bulan end_date tidak punya target."
      parameters:
        - { name: start_date, in: query, required: true, schema: { type: string, format: date }, description: "Awal periode (tanggal WIB, inklusif), maksimal 31 hari dari end_date" }
        - { name: end_date, in: query, required: true, schema: { type: string, format: date }, description: "Akhir periode (tanggal WIB, inklusif)" }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Satu halaman ranking cabang
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/BranchPerformance" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "400":
          description: Parameter atau filter tidak valid (invalid_query atau invalid_filter)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Kesalahan server (internal_error)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/branch-kpi-targets:
    get:
      summary: Target KPI bulanan satu cabang
      description: "Respons satu objek berbentuk {data} tanpa meta. Target hanya dibaca, tidak ada endpoint tulis."
      parameters:
        - { name: branch_id, in: query, required: true, schema: { type: string } }
        - { name: month, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' }, description: "Bulan target, format YYYY-MM", example: "2026-11" }
      responses:
        "200":
          description: Target KPI bulan itu
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/KPITarget" }
        "400":
          description: Parameter kosong atau format salah (invalid_query)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Target tidak ada (target_not_found)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Kesalahan server (internal_error)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  schemas:
    CourierMetric:
      type: object
      required: [courier_id, courier_name, branch_id, date, total_packages, delivered, failed, on_time, success_rate, sla_rate]
      properties:
        courier_id: { type: string, example: C001 }
        courier_name: { type: string, example: Budi }
        branch_id: { type: string, example: JKT01 }
        date: { type: string, format: date, example: "2026-11-17" }
        total_packages: { type: integer, example: 10 }
        delivered: { type: integer, example: 8 }
        failed: { type: integer, example: 2 }
        on_time: { type: integer, example: 6 }
        success_rate: { type: number, description: "delivered / total_packages (0..1)", example: 0.8 }
        sla_rate: { type: number, description: "on_time / delivered (0..1)", example: 0.75 }
    CourierPerformance:
      type: object
      required: [rank, courier_id, courier_name, branch_id, total_packages, delivered, failed, on_time, success_rate, sla_rate, success_rate_gap, daily]
      properties:
        rank: { type: integer, minimum: 1, description: "Posisi global (1 sampai meta.total), stabil di semua halaman. Urut success_rate menurun, lalu courier_id menaik.", example: 1 }
        courier_id: { type: string, example: C001 }
        courier_name: { type: string, example: Budi Santoso }
        branch_id: { type: string, example: JKT01 }
        total_packages: { type: integer, example: 40 }
        delivered: { type: integer, example: 36 }
        failed: { type: integer, example: 4 }
        on_time: { type: integer, example: 33 }
        success_rate: { type: number, description: "delivered / total_packages (0..1)", example: 0.9 }
        sla_rate: { type: number, description: "on_time / delivered (0..1)", example: 0.9166666666666666 }
        success_rate_gap: { type: number, description: "success_rate peringkat 1 dikurangi success_rate kurir ini (0 untuk peringkat 1). Dihitung backend karena peringkat 1 bisa ada di halaman lain.", example: 0 }
        daily:
          type: array
          description: "Satu entri per tanggal WIB dari start_date sampai end_date, urut menaik. Hari tanpa event bernilai 0. Jumlah tiap field sama dengan totalnya."
          items: { $ref: "#/components/schemas/DailyCount" }
        success_rate_status: { type: string, enum: [met, below], nullable: true, description: "met bila success_rate sama atau di atas meta.branch_target.success_rate, below bila di bawah (nilai mentah). null bila meta.branch_target null.", example: met }
    DailyCount:
      type: object
      required: [date, total_packages, delivered, failed, on_time]
      properties:
        date: { type: string, format: date, description: "Tanggal WIB", example: "2026-11-01" }
        total_packages: { type: integer, example: 6 }
        delivered: { type: integer, example: 6 }
        failed: { type: integer, example: 0 }
        on_time: { type: integer, example: 5 }
    CourierPerformanceMeta:
      description: "PageMeta ditambah branch_target. Field page, page_size, total tidak berubah."
      allOf:
        - { $ref: "#/components/schemas/PageMeta" }
        - type: object
          required: [branch_target]
          properties:
            branch_target:
              type: object
              nullable: true
              description: "Target rate cabang di bulan end_date. null bila branch_id kosong atau cabang tanpa target di bulan itu."
              required: [month, success_rate, sla_rate]
              properties:
                month: { type: string, pattern: '^\d{4}-\d{2}$', example: "2026-11" }
                success_rate: { type: number, example: 0.9 }
                sla_rate: { type: number, example: 0.85 }
    FailedSummary:
      type: object
      required: [total_packages, total_failed, failed_rate, previous_total_failed, failed_change_rate, reasons, top_couriers]
      properties:
        total_packages: { type: integer, description: "Jumlah event delivered dan failed di periode", example: 1200 }
        total_failed: { type: integer, example: 180 }
        failed_rate: { type: number, description: "total_failed / total_packages (0..1); 0 bila total_packages 0", example: 0.15 }
        previous_total_failed: { type: integer, description: "total_failed di periode pembanding", example: 200 }
        failed_change_rate: { type: number, nullable: true, description: "(total_failed - previous_total_failed) / previous_total_failed; null bila previous_total_failed 0", example: -0.1 }
        reasons:
          type: array
          description: "Urut count menurun lalu reason menaik. Jumlah count sama dengan total_failed. [] bila tanpa gagal. failed_reason NULL atau kosong menjadi Tanpa alasan."
          items: { $ref: "#/components/schemas/FailedReason" }
        top_couriers:
          type: array
          description: "Maksimal 5, urut failed menurun lalu courier_id menaik, hanya kurir dengan failed > 0."
          maxItems: 5
          items: { $ref: "#/components/schemas/FailedCourier" }
    FailedReason:
      type: object
      required: [reason, count, share]
      properties:
        reason: { type: string, example: Penerima tidak di tempat }
        count: { type: integer, example: 60 }
        share: { type: number, description: "count / total_failed (0..1)", example: 0.3333333333 }
    FailedCourier:
      type: object
      required: [rank, courier_id, courier_name, branch_id, total_packages, failed, failed_rate]
      properties:
        rank: { type: integer, minimum: 1, example: 1 }
        courier_id: { type: string, example: C002 }
        courier_name: { type: string, example: Sari Wulandari }
        branch_id: { type: string, description: "Cabang event terakhir kurir di periode", example: JKT01 }
        total_packages: { type: integer, example: 40 }
        failed: { type: integer, example: 30 }
        failed_rate: { type: number, example: 0.75 }
    BranchPerformance:
      type: object
      required: [rank, branch_id, courier_count, total_packages, delivered, failed, on_time, success_rate, sla_rate, target, daily]
      properties:
        rank: { type: integer, minimum: 1, description: "Posisi global, stabil di semua halaman", example: 1 }
        branch_id: { type: string, example: BDG02 }
        courier_count: { type: integer, description: "Jumlah kurir berbeda dengan baris metrik di periode", example: 8 }
        total_packages: { type: integer, example: 1000 }
        delivered: { type: integer, example: 833 }
        failed: { type: integer, example: 167 }
        on_time: { type: integer, example: 700 }
        success_rate: { type: number, description: "delivered / total_packages (0..1)", example: 0.833 }
        sla_rate: { type: number, description: "on_time / delivered (0..1)", example: 0.8403 }
        target: { $ref: "#/components/schemas/BranchTarget" }
        daily:
          type: array
          description: "Satu entri per tanggal WIB dari start_date sampai end_date, hari kosong 0, jumlah sama dengan total."
          items: { $ref: "#/components/schemas/DailyCount" }
    BranchTarget:
      type: object
      nullable: true
      description: "Target untuk periode, bulan target = bulan end_date. null bila bulan itu tidak punya target. Target volume periode diprorata per hari lalu dibulatkan sekali di akhir (math.Round)."
      required: [success_rate, sla_rate, delivered_packages, success_rate_status, sla_rate_status, delivered_status]
      properties:
        success_rate: { type: number, example: 0.85 }
        sla_rate: { type: number, example: 0.8 }
        delivered_packages: { type: integer, description: "Target volume periode (prorata)", example: 900 }
        success_rate_status: { type: string, enum: [met, below], example: below }
        sla_rate_status: { type: string, enum: [met, below], example: met }
        delivered_status: { type: string, enum: [met, below], description: "delivered dibandingkan dengan delivered_packages", example: below }
    KPITarget:
      type: object
      required: [branch_id, month, success_rate, sla_rate, delivered_packages]
      properties:
        branch_id: { type: string, example: JKT01 }
        month: { type: string, pattern: '^\d{4}-\d{2}$', example: "2026-11" }
        success_rate: { type: number, example: 0.9 }
        sla_rate: { type: number, example: 0.85 }
        delivered_packages: { type: integer, description: "Target paket terkirim sebulan", example: 3000 }
    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: invalid_filter }
            message: { type: string }
